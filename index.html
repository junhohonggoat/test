
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우주 슈팅 게임</title>
<style>
    body {
        margin: 0;
        background: #080b1c;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        color: #55eaff;
        margin: 15px;
    }

    canvas {
        background: #10172e;
        border: 2px solid #55eaff;
        display: block;
        margin: 10px auto;
        max-width: 95vw;
    }

    button {
        padding: 12px 25px;
        background: #00c8ff;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        cursor: pointer;
    }

    p {
        color: #ccc;
    }
</style>
</head>
<body>

<h1>🚀 우주 슈팅 게임</h1>
<p>← → 이동 | SPACE 발사</p>
<h3>점수: <span id="score">0</span></h3>

<canvas id="game" width="400" height="600"></canvas>

<button onclick="restart()">다시 시작</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, bullets, enemies, score, gameOver;
let keys = {};

function restart() {
    player = { x: 180, y: 530, w: 40, h: 40 };
    bullets = [];
    enemies = [];
    score = 0;
    gameOver = false;
    document.getElementById("score").textContent = score;
    gameLoop();
}

document.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (e.code === "Space") e.preventDefault();
});

document.addEventListener("keyup", e => {
    keys[e.code] = false;
});

function drawPlayer() {
    ctx.fillStyle = "#00eaff";
    ctx.beginPath();
    ctx.moveTo(player.x + 20, player.y);
    ctx.lineTo(player.x, player.y + 40);
    ctx.lineTo(player.x + 40, player.y + 40);
    ctx.closePath();
    ctx.fill();
}

function shoot() {
    bullets.push({
        x: player.x + 18,
        y: player.y,
        w: 4,
        h: 15
    });
}

let lastShot = 0;

function update() {
    if (keys["ArrowLeft"] || keys["KeyA"])
        player.x -= 5;

    if (keys["ArrowRight"] || keys["KeyD"])
        player.x += 5;

    player.x = Math.max(0, Math.min(360, player.x));

    if (keys["Space"] && Date.now() - lastShot > 250) {
        shoot();
        lastShot = Date.now();
    }

    bullets.forEach(b => b.y -= 8);
    bullets = bullets.filter(b => b.y > 0);

    if (Math.random() < 0.025) {
        enemies.push({
            x: Math.random() * 360,
            y: -40,
            w: 40,
            h: 40
        });
    }

    enemies.forEach(e => e.y += 3);

    bullets.forEach((b, bi) => {
        enemies.forEach((e, ei) => {
            if (
                b.x < e.x + e.w &&
                b.x + b.w > e.x &&
                b.y < e.y + e.h &&
                b.y + b.h > e.y
            ) {
                bullets[bi].hit = true;
                enemies[ei].hit = true;
                score += 10;
                document.getElementById("score").textContent = score;
            }
        });
    });

    bullets = bullets.filter(b => !b.hit);
    enemies = enemies.filter(e => !e.hit && e.y < 650);

    enemies.forEach(e => {
        if (
            player.x < e.x + e.w &&
            player.x + player.w > e.x &&
            player.y < e.y + e.h &&
            player.y + player.h > e.y
        ) {
            gameOver = true;
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, 400, 600);

    // 별 배경
    ctx.fillStyle = "white";
    for (let i = 0; i < 40; i++) {
        let x = (i * 97) % 400;
        let y = (i * 137 + Date.now() / 30) % 600;
        ctx.fillRect(x, y, 2, 2);
    }

    drawPlayer();

    // 총알
    ctx.fillStyle = "#ffff00";
    bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.w, b.h);
    });

    // 적 우주선
    ctx.fillStyle = "#3A86FF";
    enemies.forEach(e => {
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = "#fff";
        ctx.fillRect(e.x + 8, e.y + 10, 7, 7);
        ctx.fillRect(e.x + 25, e.y + 10, 7, 7);
        ctx.fillStyle = "#3A86FF";
    });

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(0, 0, 400, 600);

        ctx.fillStyle = "#ff4757";
        ctx.font = "bold 40px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", 200, 270);

        ctx.fillStyle = "white";
        ctx.font = "22px Arial";
        ctx.fillText("점수: " + score, 200, 320);
        ctx.font = "16px Arial";
        ctx.fillText("다시 시작 버튼을 누르세요", 200, 360);
    }
}

let animationId;

function gameLoop() {
    cancelAnimationFrame(animationId);

    function loop() {
        if (!gameOver) {
            update();
            draw();
            animationId = requestAnimationFrame(loop);
        } else {
            draw();
        }
    }

    loop();
}

restart();
</script>

</body>
</html>
